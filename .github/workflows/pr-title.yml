name: PR title

# Pull requests are squash-merged, so the title becomes the commit message on
# main, and Release Please builds the changelog and picks the version bump from
# those messages. A title that is not a Conventional Commit would be ignored.
on:
  # pull_request_target also runs for pull requests from forks. That is safe
  # here because the job never checks out or runs code from the pull request;
  # the action reads only the title.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The types in CONTRIBUTING.md. Optional scopes and "!" are accepted.
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            chore
            ci
            build
